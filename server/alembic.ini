# Alembic config for server/migrations. Deliberately minimal: the
# database URL is NOT set here - env.py reads DATABASE_URL through
# server/db.py's _database_url() so the postgres:// -> postgresql+psycopg
# scheme rewrite (Railway hands out the former) happens in exactly one
# place instead of two.
#
# Run from the repo root:
#   alembic -c server/alembic.ini upgrade head
#   alembic -c server/alembic.ini revision --autogenerate -m "add xyz"
#
# In production this runs automatically at startup - see
# server/db.py::migrate_to_head().
[alembic]
script_location = %(here)s/migrations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
